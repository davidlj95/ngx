name: Style
on:
  workflow_call:

permissions:
  contents: none

jobs:
  build:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Format check
        run: pnpm run format:check
